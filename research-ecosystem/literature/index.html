<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文献库</title>
    <link rel="stylesheet" href="../../styles.css">
    <script defer src="../../site.js"></script>
  </head>
  <body class="subpage">
    <main class="page-shell" data-app="literature">
      <a class="back-link" href="../">← 返回科研生态中心</a>
      <p class="section-kicker">Literature</p>
      <h1>文献库</h1>
      <p class="page-lead">记录论文的研究问题、主要结论和下一步阅读方向。数据保存在当前浏览器，可导出 JSON 备份。</p>

      <form class="tool-form" data-form>
        <label>论文标题<input name="title" required placeholder="例如：Tumor microenvironment and immune escape"></label>
        <label>年份<input name="year" placeholder="2026"></label>
        <label>研究问题<textarea name="question" placeholder="这篇文章试图回答什么问题？"></textarea></label>
        <label>主要结论<textarea name="finding" placeholder="最值得记住的发现是什么？"></textarea></label>
        <label>下一步<textarea name="next" placeholder="下一篇要读什么，或要补什么背景？"></textarea></label>
        <button class="button primary" type="submit">保存文献记录</button>
      </form>

      <div class="tool-bar">
        <input data-search type="search" placeholder="搜索标题、问题、结论">
        <button class="button secondary" type="button" data-export>导出 JSON</button>
        <button class="button secondary" type="button" data-clear>清空本地数据</button>
      </div>

      <section class="tool-list" data-list></section>
    </main>
  </body>
</html>
