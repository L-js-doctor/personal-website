<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知识图谱</title>
    <link rel="stylesheet" href="../../styles.css">
    <script defer src="../../site.js"></script>
  </head>
  <body class="subpage">
    <main class="page-shell" data-app="knowledge">
      <a class="back-link" href="../">← 返回科研生态中心</a>
      <p class="section-kicker">Knowledge Map</p>
      <h1>知识图谱</h1>
      <p class="page-lead">把医学概念、机制链条、关联疾病和易混点保存成可搜索节点。</p>

      <form class="tool-form" data-form>
        <label>系统/学科<input name="system" placeholder="病理学、免疫学、肿瘤学"></label>
        <label>概念<input name="concept" required placeholder="例如：肉芽肿性炎"></label>
        <label>机制链条<textarea name="mechanism" placeholder="原因 → 细胞反应 → 组织改变 → 临床表现"></textarea></label>
        <label>关联疾病<textarea name="disease" placeholder="哪些疾病或场景会用到这个概念？"></textarea></label>
        <label>易混点<textarea name="compare" placeholder="和哪个概念容易混？怎么区分？"></textarea></label>
        <button class="button primary" type="submit">保存知识节点</button>
      </form>

      <div class="tool-bar">
        <input data-search type="search" placeholder="搜索概念、机制、疾病">
        <button class="button secondary" type="button" data-export>导出 JSON</button>
        <button class="button secondary" type="button" data-clear>清空本地数据</button>
      </div>

      <section class="tool-list" data-list></section>
    </main>
  </body>
</html>
